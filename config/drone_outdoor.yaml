# Defaults for the outdoor drone product chain (samcloud/drone).
class_codes:                 # LAS class codes for outdoor classes
  road_marking: 82           # road marking class code
  path: 83                   # path class code
  custom_slots_start: 200    # first free code for user-defined classes
environment:
  working_voxel_m: auto      # float metres or auto
  max_working_points: 8000000  # auto chooses the smallest voxel within this limit
  min_working_voxel_m: 0.03
  clip_point_cloud: true     # clip the user-facing point cloud products (LAZ/LAS, viewer) to the processing boundary
semantics:
  plane_k: 24                # maximum neighbours for local planar metrics
  plane_chunk_size: 500000   # points processed per local-PCA batch
terrain:
  dsm_resolution_m: 0.10     # DSM raster cell size
  dtm_resolution_m: 0.25     # DTM raster cell size
  ground_filter: auto        # auto|pmf|csf (auto = winner of the comparison)
  csf:                       # cloth simulation filter parameters
    cloth_resolution_m: 0.5  # cloth grid size
    rigidness: 2             # cloth rigidness (1..3)
    class_threshold_m: 0.15  # max distance cloth-to-point for ground
    iterations: 500          # simulation iterations
    time_step: 0.65          # simulation time step
  clean:                     # DTM clean-up before the TIN (samcloud/terrain/clean.py)
    enabled: true
    window_m: 5.0            # window of the robust local surface (morphological opening)
    max_bump_m: 0.15         # cells higher than the local surface by more than this are bump seeds
    max_bump_area_m2: 25.0   # bumps with a larger area are real terrain and stay
    tall_bump_m: 1.0         # bumps at least this high (objects, shrub groups) ...
    tall_area_factor: 4.0    # ... may cover this many times max_bump_area_m2
    grow_fraction: 0.25      # a bump is grown down to this share of max_bump_m ...
    grow_margin_m: 1.0       # ... but never further than this from a seed
    steep_slope: 1.0         # gradient above this marks a step/wall
    wall_min_length_m: 2.0   # steep features longer than this are retaining walls and stay untouched
    protect_dilate_m: 0.5    # cells near curbs/pavement points are never modified
    median_cells: 3          # median filter size on measured terrain cells (0 = off)
  smooth:                    # robust per-element smoothing of pavement surfaces
    enabled: true
    window_m: 2.0            # local plane window
    iterations: 3            # robust reweighting rounds
    robust_scale_m: 0.08     # Tukey scale of the residuals
    max_change_m: 0.06       # a cell never moves further than this (larger jumps are real relief)
  deviation:
    max_rms_pavement_m: 0.04
    max_rms_terrain_m: 0.06
    max_points: 400000
  tin:                       # constrained TIN meshing
    constraint_buffer_m: 0.05    # buffer around breaklines
    min_angle_deg: 20            # minimum triangle angle
    max_steiner_per_edge: 50     # cap on Steiner points per edge
    tolerance_m: 0.03            # max vertical deviation TIN vs. ground reference
    tolerance_pavement_m: 0.02   # max vertical deviation on road/sidewalk/path
    tolerance_terrain_m: 0.04    # max vertical deviation on terrain and lawn
    initial_spacing_m: 2.0       # start grid before error-driven insertion
    support_spacing_m: 0.50      # DTM cell spacing used for robust TIN support selection
    max_vertices: 60000          # hard cap
    max_refinement_rounds: 2     # bounded batched error-refinement iterations
  lawn_ground_percentile: 20.0   # former lawn cells: this percentile of the ground/low-vegetation heights per cell is the ground
  lawn_ground_min_points: 4      # fewer points in a lawn cell -> interpolated from the surrounding ground
  lawn_ground_max_lowering_m: 0.25   # a lawn cell never drops further than this below the cleaned DTM
  manhole_ring_segments: 16      # polygon ring that makes a manhole a TIN constraint
  manhole_below_m: 0.001         # the terrain lies this far below the manhole cover
  step:                          # vertical steps (curb faces, path edges, retaining walls) as top + bottom edge (samcloud/terrain/steps.py)
    enabled: true
    min_slope_deg: 60.0          # steep DTM features from this gradient on are step candidates
    min_length_m: 1.0            # steep DTM features must be at least this long
    probe_m: 0.15                # height probes this far to both sides of the line
    min_jump_m: 0.04             # smaller height jumps stay a single breakline
    offset_m: 0.01               # the bottom edge lies this far (horizontally) outside the top edge
    min_run_m: 0.5               # shorter runs of a jump are ignored
    sample_m: 0.25               # spacing of the probes along a line
    dtm_features: true           # steep DTM lines count as walls ...
    wall_min_jump_m: 0.25        # ... when the jump is at least this at probe_m and at twice probe_m
  flush:                         # pavement edges without a curb are flush with the terrain (samcloud/terrain/flush.py)
    enabled: true
    blend_m: 1.0                 # terrain vertices within this band outside the edge are blended to the edge height
    probe_m: 0.15                # the edge height is the pavement surface this far inside the pavement
    sample_m: 0.25               # spacing of the edge samples
    step_clear_m: 0.05           # no flush edge within this distance of a step run
    qa_tol_m: 0.01               # QA 18: terrain vs pavement edge tolerance
buildings:
  ransac_distance_m: 0.05    # RANSAC inlier distance for planes
  region_growing:            # plane region growing
    k: 16                    # neighbours for normal estimation
    epsilon_m: 0.08          # max point-to-plane distance
    min_points: 200          # min points per region
    normal_angle_deg: 10     # max normal deviation
  label_pruning_buffer_m: 2.5    # buffer when pruning stray building labels
  complexity_factor: 0.7     # roof model complexity trade-off
  max_seconds_per_building: 60   # time budget per building
  roof:
    min_plane_area_m2: 4.0   # minimum measured DSM support for one roof plane
    inlier_tolerance_m: 0.08 # DSM plane inlier distance
    min_roof_height_m: 1.5   # DSM cells lower than this above the DTM are not roof
    region_simplify_m: 0.35  # boundary tolerance between sloped planes (ridges/valleys are re-cut exactly)
    step_simplify_m: 0.12    # boundary tolerance at height steps (errors scale with the step)
    outline_simplify_m: 0.3  # tolerance of the outline after roofless parts are removed
    min_region_area_m2: 1.0  # smaller roof regions are merged into their neighbour
    min_feature_area_m2: 6.0 # roof features (dormers, annexes) below this area are merged
    min_step_m: 0.35         # height differences below this are not roof steps
    merge_normal_deg: 4.0    # roof planes with normals closer than this may be merged
    merge_offset_m: 0.15     # ... when their plane offset is below this
  dxf:
    coplanar_deg: 2.0        # roof edges between faces closer than this are not drawn in the DXF
  base:                      # wall bottoms follow the terrain
    mode: terrain            # terrain: bottom = terrain at each outline vertex; flat_min: lowest terrain under the footprint
    embed_m: 0.02            # walls end this far below the terrain (no visible gap)
    max_edge_m: 2.0          # outline edges are checked against the terrain at this spacing (and split where it bends)
    follow_tol_m: 0.03       # terrain deviation from the straight wall bottom that adds a vertex
  plausibility:
    min_width_m: 2.5         # narrow strips are walls or hedges, not buildings
    min_area_m2: 10.0        # minimum plausible building footprint
    min_height_m: 2.5        # minimum 95th percentile height above the DTM
    min_plane_area_m2: 4.0   # minimum roof plane area for a plausible building
  regularize:
    angle_tol_deg: 12        # snap nearly axial footprint and roof edges
    merge_offset_m: 0.3      # maximum offset when merging parallel footprint edges
    min_edge_m: 0.5          # remove smaller footprint facets and jogs
    ridge_tol_deg: 5         # symmetric slope tolerance for horizontal ridges
    flat_slope_deg: 5        # slopes below this value become flat roofs
    eave_tol_m: 0.15         # shared eave-height reconciliation tolerance
    min_footprint_iou: 0.92  # retain only footprint changes close to the source
    max_rmse_increase_m: 0.03  # retain only roof changes within fit tolerance
openings:
  min_views: 3               # min camera views as evidence
  min_area_m2: 0.3           # smallest accepted opening
  max_area_m2: 12.0          # largest accepted opening
  door_bottom_tolerance_m: 0.20  # door bottom vs. ground tolerance
  window_min_sill_m: 0.40    # min sill height for windows
  reference_strip_m: 0.5     # facade strip used as depth reference
vegetation:
  tree_min_height_m: 2.0     # min height to count as tree
  tree_min_points: 200       # min points per tree
  crown_triangles: {min: 60, max: 120}   # crown mesh triangle budget
  default_trunk_diameter_m: 0.30     # used only with ParamOrigin.ASSUMED
  crown:                     # crown shape fit (sphere/ellipsoid/cone/umbrella/cylinder)
    min_crown_points: 150    # fewer crown points -> ellipsoid, status assumed
    slices: 12               # height slices of the upper-envelope profile
    min_slice_points: 15     # slices with fewer points are ignored
    envelope_percentile: 90.0  # per-slice radius = this percentile of the radial distance from the crown axis
    base_radius_fraction: 0.2  # crown base = lowest height where the radius reaches this fraction of the max
    sphere_aspect_tol: 0.15  # |height / diameter - 1| below this -> sphere instead of ellipsoid
    margin: 0.15             # a shape must have a residual >= this fraction lower than the ellipsoid's
    cone_rho: -0.6           # cone: Spearman(z, r) over the upper 70 % must be <= this
    cylinder_aspect: 1.8     # cylinder: height / diameter at least this
    umbrella_aspect: 0.6     # ellipsoid with height / diameter below this is an umbrella (flattened dome)
    cylinder_cv: 0.15        # cylinder: coefficient of variation of r over the middle 80 % at most this
  trunk:                     # trunk circle fit; measured only when every gate passes
    max_rms_m: 0.03          # circle fit RMS
    min_points: 20           # min trunk points in the band
    min_diameter_m: 0.05
    max_diameter_m: 2.0
    band_m: [0.5, 1.6]       # height band above the terrain used for the circle fit
    search_radius_m: 1.0     # tree points below the crown must lie this close to the trunk position
pavement:
  min_thickness_m: 0.10      # min pavement layer thickness
  snap_tolerance_m: 0.01     # vertex snapping tolerance
  max_gap_overlap_cm2: 1.0   # max tolerated gap/overlap between polygons
  snap_search_m: 0.15        # search radius for snapping to curbs (residual target stays max_gap_overlap_cm2)
  gap_tolerance_m: 0.15      # gaps narrower than this between neighbouring pavements are closed
  min_area_m2: 2.0           # smaller pavement polygons become QA entries instead of elements
  outline:
    close_m: 0.25            # close narrow gaps between labelled TIN triangles
    open_m: 0.10             # remove narrow spikes after closing
    min_area_m2: 2.0         # discard small disconnected footprint parts
    min_hole_m2: 1.0         # discard tiny footprint holes
    simplify_m: 0.05         # topology-preserving Douglas-Peucker tolerance
curb:
  min_length_m: 0.3          # shorter curb axes are not emitted
  dp_tolerance_m: 0.015      # Douglas-Peucker tolerance for axis thinning
  section_width_m: 0.12      # curb cross-section width
  section_height_m: 0.25     # curb cross-section height
  arc_fit_max_residual_m: 0.01   # max residual for arc fitting
  arc_max_radius_m: 50.0     # larger radii are treated as straight
  arc_min_points: 4          # min points for an arc
  dedupe_offset_m: 0.5       # parallel curb axes closer than this are one curb (the one at the height jump stays)
  dedupe_angle_deg: 10.0     # axes within this angle count as parallel
  dedupe_overlap: 0.5        # share of the shorter axis that must run alongside the other
  gutter_width_m: 0.30       # gutter stone (Wasserstein) width when it cannot be measured (ASSUMED)
  gutter_thickness_m: 0.12   # gutter stone thickness
  gutter_min_band_m: 0.15    # a flat curb-class band at foot level at least this wide is a measured gutter
  gutter_z_tol_m: 0.03       # band points within this height of the foot level belong to the gutter
  embed_m: 0.15              # curb body extends this far below the road-side foot level
  flush_max_m: 0.03          # reveal below this is a flush curb (nothing may stick out of the surface)
  flush_min_run: 3           # a flush run needs this many consecutive stations
  default_reveal_m: 0.12     # reveal when no surface points exist beside the curb (ASSUMED)
  max_reveal_m: 0.35         # a higher step beside the curb (stairs, retaining wall) is not trusted as the road surface
  section_halfwidth_m: 0.6   # cross-section analysis reaches this far to each side of the curb
  section_step_m: 0.25       # station spacing of the cross-section analysis
  gutter_station_m: 0.25     # the gutter strip follows the surface at this station spacing
  gutter_flat_tol_m: 0.01    # a gutter needs a planar surface: middle / midpoint of the strip within this of the linear interpolation
  gutter_max_cross_m: 0.05   # ... and a fall across the strip of at most this (ramps and stair-like steps get no gutter)
  gutter_min_run_m: 0.5      # shortest gutter stretch
  surface_probe_m: 0.06      # distance beyond the curb face where the TIN is sampled for the curb top / road side
  gutter_pavement_reach_m: 0.3   # a gutter stone needs a road/sidewalk polygon this close on its side
  dxf_flat_tol_m: 0.003      # only curbs with a smaller Z range are written as flat LWPOLYLINE (at the median z)
site:
  fence:
    eps_m: 0.3               # XY neighbour distance of fence points (neighbouring fences stay separate)
    step_m: 0.25             # station spacing along the fence
    min_points: 4            # min points per fence
    min_station_points: 2    # min points per station
    branch_offset_m: 0.3     # points farther than this from the traced path start a branch
    top_percentile: 95.0     # top edge = this percentile of the station z values
    smooth_window: 5         # median filter of top and bottom edge (stations)
    dp_m: 0.02               # Douglas-Peucker tolerance of the edges
    thickness_m: 0.04        # IFC fence thickness
    min_height_m: 0.2        # lower fences are rejected (the bottom edge is at most top - 0.2 m)
    min_length_m: 0.5        # shorter fence fragments are rejected
    bottom_percentile: 3.0   # lower envelope of the fence points per station
    bottom_smooth_window: 9  # median filter of the bottom edge (stations)
    bottom_dp_m: 0.03        # Douglas-Peucker tolerance of the bottom edge
    ground_snap_m: 0.15      # envelope within this of the terrain: bottom = smooth terrain, else the envelope itself
    terrain_radius_m: 0.5    # disc radius of the terrain median
    merge_gap_m: 1.0         # collinear fragments with an end gap below this are one fence
    merge_angle_deg: 15.0    # direction difference of mergeable fragment ends
    merge_height_diff_m: 0.3 # height difference of mergeable fragments
  wall:
    eps_m: 0.75              # XY neighbour distance of site wall points
    step_m: 0.4              # station spacing along the wall
    min_points: 4
    min_station_points: 3
    branch_offset_m: 0.8
    top_percentile: 95.0
    smooth_window: 5
    dp_m: 0.02
    min_thickness_m: 0.1
    top_variation_m: 0.10    # top or base varying more than this along the wall makes a triangulated solid
    terrain_radius_m: 0.5    # disc radius of the terrain median (wall base)
manhole:
  thickness_m: 0.05          # IFC cover body thickness (top = cover height)
  standard_diameters_m: [0.27, 0.42, 0.62, 0.745, 0.785, 0.85, 0.92, 1.05]   # visible outer diameter of Swiss covers/frames from above
  standard_labels: [Schieberkappe, Hydrantenkappe, Deckel LW600-625, Rahmen LW625 / Trottoirdeckel, Rahmen LW600 (Typ Viatop), Rahmen LW600 (Typ Pamrex), Rahmen LW800, Betonuntersatz]
  snap_tol_m: 0.08           # snap to the nearest standard size within this (diameters >= 0.5 m) ...
  snap_tol_small_m: 0.04     # ... or this (smaller ones), and only if closer than half the distance to the second-nearest size
dxf:
  local_origin: false        # false = real LV95 coordinates
  hatch: false               # write hatches
  contour_major_m: 1.0       # major contour interval
  contour_minor_m: auto      # auto -> 0.2 or 0.5 chosen from noise/slope
  spline_contours: true      # smooth contours as splines
  tin_layer_frozen: true     # freeze TIN layer
  spot_spacing_m: 10.0       # spacing of the thinned S-ELEV spot-height grid
  spot_heights: false        # write S-ELEV spot heights (off: contour labels are used instead)
  contour_label_spacing_m: 10.0   # a height label on every major contour each this many metres along the line
  contour_label_height_m: 0.25    # text height of the contour labels (layer S-TOPO-TEXT)
  contour_building_gap_m: 0.10    # contours are cut this far outside the building footprints
  block_text_height_m: 0.2   # text height of the visible TREE/MANHOLE block attributes
  fence_bottom_line: false   # also write the fence bottom edge (S-FENC)
ifc:
  curb_sweep: auto           # auto|extrude_only
  epsg: 2056                 # CRS code
  vertical_datum: LN02       # height datum
cloud_filter:                # tiled cloud clean-up (samcloud/drone/cloud_filter.py)
  tile_size_m: 10.0          # processing tile edge length
  halo_m: 1.0                # overlap around each tile to avoid edge effects
  outliers:                  # statistical/radius outlier removal
    nb_neighbors: 20         # neighbours for the mean-distance statistic
    std_ratio: 2.0           # reject points beyond mean + std_ratio * sigma
    radius: null             # optional radius criterion (m); null = off
    min_points: null         # min neighbours within radius; null = off
  planar:                    # denoise planar surfaces (roofs, walls, ...)
    class_codes: [6, 144, 145]   # LAS codes treated as planar
    sigma_factor: 1.0        # noise sigma multiplier for plane inliers
    curvature_keep: 0.05     # keep points with curvature above this (edges)
    radius: 0.3              # neighbourhood radius (m)
    min_inlier_fraction: 0.95    # plane accepted if this share fits
    max_rms_m: 0.015         # plane accepted if RMS below this
  ground:                    # denoise ground-like surfaces
    class_codes: [2, 11, 71, 73, 83, 82]   # LAS codes treated as ground surface
    radius: 0.5              # neighbourhood radius (m)
    normal_jump_deg: 12.0    # normal change that marks an edge
    curb_clearance_m: 0.15   # protected distance around curb points
    curb_code: 74            # LAS code of curb points
    sigma_factor: 1.0        # noise sigma multiplier for surface inliers
    min_inlier_fraction: 0.95    # surface accepted if this share fits
    max_rms_m: 0.015         # surface accepted if RMS below this
boundary:                    # processing boundary (samcloud/drone/perimeter.py)
  mode: camera_hull          # camera_hull | perimeter (KML) | intersection | none
  buffer_m: 10.0             # outward buffer of the camera-position convex hull
  perimeter_path: null       # KML path (relative to project or absolute); null = inputs/survey/*.kml
  perimeter_buffer_m: 2.0    # margin around the KML polygon in mode "perimeter"
surfaces:
  clean:                     # cleaning of lawn / sidewalk / path polygons before the TIN
    close_m: 0.4             # morphological close
    open_m: 0.2              # morphological open
    min_area_m2: {lawn: 4.0, sidewalk: 2.0, path: 2.0}   # smaller parts fall back to terrain
    min_hole_m2: 2.0         # smaller holes are filled
    simplify_m: 0.10         # topology-preserving Douglas-Peucker tolerance
    min_width_m: 0.6         # narrower slivers are merged into the neighbour with the longest shared edge
edges:
  enabled: true
  fit:                       # lines and circular arcs for outlines and curbs (samcloud/terrain/edges.py)
    min_radius_m: 1.0        # smaller radii stay straight segments
    max_radius_m: 200.0      # larger radii are straight
    tolerance_m: 0.05        # max deviation fitted vs cleaned outline
    sample_m: 0.10           # resampling step of the outline
    tangent_deg: 10.0        # line/arc junctions closer than this are made tangent
    merge_deg: 3.0           # near-collinear neighbouring lines are merged
    sagitta_m: 0.01          # arcs are densified to this sagitta for TIN/IFC and 3D polylines
    curb_match_m: 0.12       # curb axis is taken from a shared outline edge within this distance
  dxf_curb_flat_z_m: 0.05    # curbs with a smaller Z range are written as LWPOLYLINE with bulges
  image:                     # boundaries road|sidewalk|path|terrain refined with the top-down colour image (samcloud/environment/image_edges.py)
    enabled: true
    cell_m: 0.03             # ortho cell size (coloured dense cloud, products/environment/ortho_rgb.tif)
    z_percentile: 0.7        # colour of the points above this height percentile of a cell
    hole_fill_cells: 3       # ortho holes up to this many cells are filled
    search_m: 0.30           # perpendicular search distance around the class-raster edge
    step_m: 0.02             # offset step of the search
    window_m: 0.06           # half width of the before/after windows of the step detector
    along_m: 0.6             # profiles are averaged over this length along the edge
    sigma_m: 0.03            # Gaussian smoothing of the Lab image
    weight_color: 1.0        # weight of the Lab colour step
    weight_height: 1.0       # weight of the height step (1 cm = this many Lab units)
    min_contrast: 5.0        # a sample is supported when its combined step is at least this
    prior_per_m: 1.0         # cost per metre of shift (tie break towards the class-raster edge)
    smooth_cost: 1.5         # cost per step of offset change between neighbouring samples
    max_step: 3              # largest offset change (steps) between neighbouring samples
    passes: 2                # search repeated along the refined line
    pass2_search_m: 0.10     # search distance of the repeat
    fit_tolerance_m: 0.03    # line/arc tolerance for image-derived samples
    straight: true           # robust line segmentation (RANSAC) of the refined samples
    min_segment_m: 1.5       # shortest straight segment
    inlier_m: 0.04           # RANSAC inlier tolerance
    merge_deg: 4.0           # consecutive segments with a smaller direction change are merged
    snap_deg: 6.0            # segment directions snap to the site's dominant orientations within this
    min_arc_radius_m: 2.0    # arcs only from this radius and only when clearly better than lines
    ransac_trials: 150       # hypotheses per RANSAC search
    hough: true              # strong straight image edges near the boundary are extra line hypotheses
    hough_parallel_deg: 8.0  # ... when parallel to the class boundary within this
    hough_min_len_m: 1.0
    merge_gap_samples: 8     # segments this close (samples) may be merged
    min_support: 0.60        # share of supported samples that must agree with the fitted line
    agree_m: 0.04            # a sample agrees when it lies this close to the fitted line
    max_area_change: 0.05    # per class; above this the class-raster outlines are kept
    min_edge_m: 0.5          # straight zig-zag edges shorter than this are removed
    zigzag_dev_m: 0.05       # ... when the line moves by less than this
    node_shift_m: 0.45       # junction nodes move at most this far
    min_chain_m: 1.0         # shorter edges stay as they are
    side_offset_m: 0.15      # probe distance that tells which surface lies on each side
  clean:                     # geometric clean-up of boundaries without image support (cars, shadows, trees)
    enabled: true
    spike_m: 0.25            # spikes narrower than this at their base ...
    spike_protrude_m: 0.10   # ... and sticking out further than this are cut
    line_tol_m: 0.08         # RANSAC inlier tolerance (looser than with image)
    min_segment_m: 1.5       # shortest straight segment
    merge_gap_samples: 40    # segments this close (0.1 m samples) may be merged into one line
    max_shift_m: 0.25        # largest move from the class-raster edge
    max_area_change: 0.05    # per polygon; cleaned edges that break it are reverted
