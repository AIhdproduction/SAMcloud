# Geometric refinement runs only for calibrated outdoor ENU point clouds.
enabled_class_sets: [outdoor]

terrain:
  # One metre cells retain terrain relief while averaging dense reconstruction noise.
  cell_size: 0.5
  # The low rank rejects occasional below-ground outliers without using an unsafe minimum.
  percentile: 5
  min_points: 5
  # Larger than ordinary flat roofs, so mislabeled roof plateaus are removed from the DTM.
  opening_window_m: 40
  ground_classes: [ground, road, sidewalk, curb, low vegetation, water]
  # Progressive morphological filter keeps hills and embankments; objects (roofs, bushes) are removed.
  method: pmf
  pmf: {windows_m: [1, 3, 6, 12, 24, 40], slope: 0.35, initial_threshold_m: 0.15, max_threshold_m: 3.0}

# SAM mean P_final confidence. Start values are intentionally easy to tune per project.
confidence:
  protect_above: 0.85
  dtm_min_confidence: 0.5
  second_best_min: 0.2

support:
  cell_size: 1.0
  percentile: 5
  min_points: 3
  window_m: 3

features:
  voxel_size: 0.5
  min_points: 6

neighbors:
  voxel_radius: 1
  min_share: 0.05
  iterations: 1

# Lawn at terrain level is ground; rough + green is low vegetation (bushes, hedges); rough bare soil stays ground.
surface:
  enabled: true
  classes: [ground, low vegetation, sidewalk]
  cell_size: 0.5
  min_points: 10
  max_hag: 2.5
  rough_vegetation_m: 0.025
  smooth_ground_m: 0.025
  lawn_max_hag: 0.25
  green_index_min: 0.05

# Removes isolated points (islands) by a 3x3x3 voxel majority; thin objects are protected.
smoothing:
  enabled: true
  voxel_size: 0.3
  iterations: 2
  own_max_share: 0.25
  majority_min_share: 0.6
  protected_classes: [utility pole, traffic sign, overhead power line, fence, curb]

flat_roof:
  source_classes: [ground, road, sidewalk, curb, water]
  min_hag: 2.5
  strong_min_hag: 5.0
  ambiguous_max_confidence: 0.6
  min_normal_z: 0.9
  min_planarity: 0.3

rules:
  ground: {max_hag: 1.0}
  road: {max_hag: 0.5, min_normal_z: 0.85, max_roughness: 0.15}
  sidewalk: {max_hag: 0.6, min_normal_z: 0.85, max_roughness: 0.15}
  curb: {max_hag: 0.6, adjacent_classes: [road, sidewalk], min_adjacent_points: 3, adjacent_voxel_radius: 2}
  water: {max_hag: 0.5, min_normal_z: 0.9}
  low vegetation: {max_hag: 2.0, max_height_above_support: 2.0}
  tree: {min_hag: 2.0}
  building: {min_hag: 0.3, or_vertical: {max_normal_z: 0.35, min_hag: 0.3}}
  vehicle: {max_hag: 4.5}
  # Roof railings and parapet fences are evaluated relative to their local support.
  fence: {max_hag: 3.0, max_height_above_support: 3.0}
  overhead power line: {min_hag: 3.0, max_planarity: 0.4}
  traffic sign: {max_hag: 6.0}
  construction container: {max_hag: 6.0}
  construction machinery: {max_hag: 10.0}
