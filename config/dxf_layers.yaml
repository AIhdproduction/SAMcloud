# Drone-pipeline outdoor layers written by samcloud/dxf/writer.py (ensure_outdoor_layers).
# Not class-driven (the loader in samcloud/dxf/layers.py ignores this key); S-SHRUB and S-PATH
# are repeated here so the writer has one complete style table. `frozen: true` = created frozen/off.
outdoor_extra_layers:
  - {name: S-BLDG-ROOF, color: 23, linetype: CONTINUOUS, lineweight: 35}
  - {name: S-BLDG-WIND, color: 141, linetype: CONTINUOUS, lineweight: 18}
