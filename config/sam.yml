model:
  weights: models/sam3.pt
  confidence_threshold: 0.4

inference:
  class_set: outdoor
  image_size: 644
  tile_size_px: 1008
  tile_minimum_overlap: 0.2
  minimum_votes: 1
  mode: segearth_ov3
  background_threshold: 0.4
  query_threshold: 0.4
  threshold_sweep: []

instances:
  enabled: true
  query_threshold: 0.5
  mask_threshold: 0.5
  min_mask_pixels: 12
  merge_overlap: 0.5
  min_shared_points: 10
  min_views: 2
  min_points: 100
  split_radius_m: 0.05
  debug_ply: false

output:
  unknown_class_id: 0
  write_ply: true
  write_las: true
