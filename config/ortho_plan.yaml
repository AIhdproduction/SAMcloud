# Outdoor DTM contours and smart text labels configuration

contours:
  resolution: 0.20
  major_interval: 1.0
  minor_interval: 0.25
  max_gap: 3.0
  smoothing_sigma_m: 0.3
  min_length: 2.0
  simplify_tolerance: 0.03
  chaikin_iterations: 2
  ground_codes:
    - 2    # Ground
    - 3    # Low Vegetation (lawn)
    - 9    # Water
    - 11   # Road Surface (road / road marking)
    - 20   # Ignored Ground
    - 66   # Hardscape (paved)
    - 70   # Natural terrain
    - 71   # Sealed terrain (paved)
    - 73   # Side walk
    - 74   # Curbstone
    - 172  # HCS asphalt road
    - 173  # HCS asphalt hardscape
    - 174  # HCS concrete road
    - 175  # HCS concrete hardscape
    - 184  # HCS curb

labels:
  base_height_factor: 0.12
  min_height: 0.08
  max_height: 0.60
  min_area: 1.0
  padding_factor: 0.15
  char_width_factor: 0.62
  shrink_step: 0.85

layers:
  S-TOPO-MAJR:
    true_color: [150, 60, 40]
    lineweight: 25
    description: "Major contour lines (every 1.0 m)"
  S-TOPO-MINR:
    true_color: [120, 170, 110]
    lineweight: 13
    description: "Minor contour lines (every 0.25 m)"
  S-ANNO:
    color: 7
    lineweight: 18
    description: "Outdoor text annotations and labels"
  S-ELEV:
    color: 3
    lineweight: 18
    description: "DGM spot elevations: crosses with absolute height text"
  A-ANNO:
    color: 7
    lineweight: 18
    description: "Indoor text annotations and labels"
  A-FURN-DETL:
    color: 8
    lineweight: 13
    description: "Indoor furniture height-step detail lines"
  A-EINB:
    color: 30
    lineweight: 35
    description: "Indoor built-ins and floor-standing fronts (vertical surface check)"
  A-AREA:
    color: 140
    lineweight: 13
    description: "Indoor room boundaries from the ceiling"
  A-OBEN:
    color: 8
    lineweight: 18
    linetype: DASHED
    description: "Indoor overhead elements (upper cabinets 1.80-2.20 m), dashed"
  A-WALL-PATT:
    color: 253
    true_color: [200, 200, 200]
    lineweight: 0
    hatch_pattern: SOLID
    description: "Indoor wall poche: solid fill of the double-line wall bodies (walls.hatch)"

indoor_vertical:
  bins: 16
  floor_fraction: 0.04
  ceiling_fraction: 0.97
  fill_fraction: 0.70
  full_fraction: 0.85
  counter_fraction: 0.30
  wall_band_m: 0.10
  min_length_m: 0.40
  axis_tolerance_deg: 5.0
  rms_m: 0.02
  support_fraction: 0.70
  max_gap_m: 0.15
  merge_offset_m: 0.03
  furniture_distance_m: 0.05
  isolation_distance_m: 0.60

indoor_ceiling:
  close_radius_m: 0.15
  marker_distance_m: 0.25
  neck_width_m: 0.50
  min_room_area_m2: 1.0
  edge_min_length_m: 0.30
  cover_distance_m: 0.10
  axis_tolerance_deg: 5.0
  sliver_width_m: 0.20
  hole_fraction: 0.25
  hole_owner_share: 0.6

clean_plan:
  segment_source: combined
  label_min_area_outdoor: 20.0
  label_min_area_indoor: 0.3
  building_angle_tolerance_deg: 15.0
  line_gap_max: 1.5
  line_angle_tol_deg: 20.0
  line_min_length: 2.0
  courtyard_min_area: 25.0
  tree_min_height: 2.0
  point_object_min_area: 0.02
  contours: true
  # For local 360 scans, ceiling height is the best available scale estimate.
  # These are fractions of floor-to-ceiling height; metric defaults remain the
  # fallback whenever the ceiling is unknown.
  nominal_storey_height: 2.5
  # Metric clouds (AprilTag scale, georeference / GCP / RTK, DXF scale) export true metres (1.0 units per metre) instead
  # of the storey-height estimate (samcloud/core/metric_scale.py; recorded as plan_model source.scale_source). The plan
  # detectors always run in storey-normalised units (plan.py _indoor_detector_units), so the plan itself does not depend
  # on this switch. Explicit project settings (project.samcloud.yml settings.scale.*) apply either way.
  metric_scale: true
  indoor_bands:
    wall: [0.72, 0.94]
    section: [0.36, 0.52]
    sill: [0.08, 0.32]
    lintel: [0.82, 0.94]
  # Indoor wall-face fitting works on measured upper-band points.
  indoor_face_min_length: 0.30
  indoor_face_ransac_residual: 0.02
  # Height-map furniture footprints. Values are in metres before local scaling.
  footprint_min_height: 0.05
  footprint_max_ceiling_fraction: 0.97
  footprint_step_height: 0.10

# Freestanding kitchen island (metres, scaled by the project units per metre).
indoor_island:
  min_height_m: 0.85
  max_height_m: 0.95
  min_depth_m: 0.80
  max_depth_m: 1.20
  min_length_m: 1.20
  wall_clearance_m: 0.15
  min_rectangularity: 0.80
  axis_tolerance_deg: 12.0
  zone_radius_m: 3.0

# Upper kitchen cabinets (layer A-OBEN) from the upper z band above a kitchen run.
# Recessed built-in niche (open wardrobe / coat niche): the wall follows the niche, the back wall is
# searched from measured evidence (wall line, wall points, room edge, side panel, contents boundary).
indoor_niche:
  min_width_m: 0.6
  max_width_m: 3.0
  min_depth_m: 0.20
  max_depth_m: 1.20
  content_height_m: 1.0
  far_percentile: 90.0
  evidence_tolerance_m: 0.10
  panel_reach_m: 0.30
  wall_point_min_count: 15
  wall_point_min_extent_m: 0.35
  beyond_reach_m: 0.60
  require_panel: true

indoor_upper_cabinets:
  band_min_m: 1.80
  band_max_m: 2.20
  depth_m: 0.35
  min_length_m: 0.40
  min_coverage: 0.50
  # A base run thinner than this (metres) is a sliver: no upper cabinet hangs above it.
  min_run_depth_m: 0.25
  gap_fill_m: 0.15
  bins: 16

# Upper cabinets from kitchen-class points (cloud + COLMAP depth), also without a base run below them.
# A hanging unit is point evidence in the band band_min_m..band_max_m that leaves gap_low_m..gap_high_m free (a tall unit does not),
# close to a wall face and inside the kitchen zone. Its height is the measured p5..p95 band of its points.
indoor_upper_points:
  enabled: true
  band_min_m: 1.40
  band_max_m: 2.25
  gap_low_m: 1.00
  gap_high_m: 1.25
  cell_m: 0.05
  min_points_per_cell: 4
  # Evidence farther than this (metres) from a wall face is no hanging unit.
  max_wall_distance_m: 0.70
  min_length_m: 0.40
  max_length_m: 4.00
  min_depth_m: 0.20
  max_depth_m: 0.60
  # A measured band thinner than this is no cabinet (shelf edge, lamp).
  min_z_span_m: 0.40
  # A hanging unit is mounted on the wall (its footprint reaches back to the wall face); evidence starting farther than this (metres)
  # from the wall plane is no wall unit (shelf on a stand, lamp).
  max_wall_gap_m: 0.25
  # A point cluster overlapping a run-based detection by this share is the same unit.
  duplicate_overlap: 0.50
  min_band_points: 40
  # A hanging unit leaves the gap band free: at most this share of its upper-band points may lie in it (a tall unit fills it).
  gap_max_ratio: 0.15

# Tight, wall-aligned footprints from an instance's own points (cloud + depth) for tall kitchen units and thin slabs (fridge seen only from the front).
indoor_tight_footprint:
  enabled: true
  cell_m: 0.05
  # A cell counts with this many points; the largest connected cluster is the footprint.
  min_cell_points: 3
  min_points: 80
  # A footprint thinner than this (metres) is a slab; it is completed towards a wall closer than back_reach_m behind it, up to max_depth_m deep.
  thin_depth_m: 0.25
  back_reach_m: 0.80
  max_depth_m: 0.80
  tall_min_top_m: 1.80
  tall_max_width_m: 1.00

# Measured furniture tops become up to four clean IFC solids while DXF keeps one outline.
indoor_furniture_solids:
  min_points: 24
  min_level_delta_m: 0.15
  min_part_area_m2: 0.08
  max_parts: 4
  # A height level below this (metres) is floor noise, not a part: its cells join the next level up.
  min_level_z_m: 0.20

# Double-line indoor walls (both faces of every wall, default). false = the single measured face lines.
# Thicknesses in metres, scaled by the project units per metre. Interior thickness classes are
# learned from measured face pairs and room edges; exterior walls use measured exterior pairs or
# exterior_thickness_m. See docs/ortho_plan.md "Double-line walls".
# Indoor wall faces off the dominant orthogonal axis pair (slanted walls, trapezoid rooms, a second wing at another angle).
# Residual wall evidence (points farther than max(explained_m, 4 x median face RMS) from the axis faces) is searched for line
# directions at least min_axis_offset_deg away from the axes (Hough on vertically persistent 2 cm cells, TLS-refined angle);
# faces of such a direction use the same projection criteria as the axis faces.  A new face must also reach the top of the wall
# band (q95 height within top_reach_m) and cover vertical_fill of its 10 cm height bins (door leaves end at ~2.0 m), be at least
# min_length_m long (or min_joined_length_m with both ends within join_reach_m of other faces), and must not run within
# near_parallel_reach_m of an existing face at less than near_parallel_angle_deg (door leaf / curtain / wall irregularity).
# Without such evidence the axis faces stay exactly unchanged.  Corners with slanted faces close down to corner_min_angle_deg.
indoor_wall_directions:
  enabled: true
  min_axis_offset_deg: 5.0
  explained_m: 0.05
  min_length_m: 1.0
  min_joined_length_m: 0.40
  join_reach_m: 0.30
  top_reach_m: 0.15
  vertical_fill: 0.50
  max_directions: 4
  corner_min_angle_deg: 15.0
  near_parallel_angle_deg: 20.0
  near_parallel_reach_m: 0.25
  # Faces of a new direction always keep both faces of a thin wall (suppression only between faces with the same empty side);
  # the measured empty side (_facing) then lets the double-line stage pair them although the closed floor mask covers the wall.
  # axis_thin_wall_faces does the same for the dominant axes (0.07-0.15 m axis walls measured instead of learned).  Default OFF:
  # it changes axis faces of existing projects (v12: 10 extra raw candidates); synthetic thin axis walls are exact with it on.
  axis_thin_wall_faces: false
  # A new-direction face must deviate from the axis direction by >= min_slant_m over its length (length x sin(angle)): below that
  # it is a diagonal through a smeared wall band (v10 unfused cloud, face spread 85-115 mm: false 6-11 deg faces of 0.5-1.95 m, max 0.35 m).
  min_slant_m: 0.40
# Ceiling-completed wall pieces on the edge of an unscanned area are no walls: a piece is dropped when fewer than
# min_vertical_support of its samples have point evidence (any class) in >= min_height_bins height bins above the lowest
# skip_low_bins (floor) bins within 6 cm, AND the space beyond it is unobserved (observed share < max_observed_share).
# Window walls keep frame/sill/lintel/curtain points (v12 minimum 0.11), so they stay.
indoor_unobserved_edges:
  enabled: true
  min_vertical_support: 0.05
  max_observed_share: 0.30
  min_height_bins: 2
  skip_low_bins: 2
walls:
  double_line: true
  # An open door leaf is never a wall: a wall run lying along the measured open leaf of a door (both ends within leaf_run_distance_m of the
  # leaf, not longer than the leaf + leaf_run_extra_m) is dropped.
  leaf_walls: true
  leaf_run_distance_m: 0.20
  leaf_run_extra_m: 0.25
  # Closed outlines: room-edge steps up to jog_merge_m are straightened onto the neighbouring parallel wall; free wall ends that face each
  # other across a step up to close_step_max_m (ends aligned within close_step_align_m) get a connecting wall piece.
  close_walls: true
  jog_merge_m: 0.25
  close_step_max_m: 0.80
  close_step_align_m: 0.35
  free_end_reach_m: 0.12
  # Depth evidence (only when the project has a depth product and depth_evidence.use_in_plan is true): COLMAP class-2 voxels the cloud
  # lacks continue a measured face along its own line (tolerance, max extension per end, along-bin) and measure the thickness of a wall
  # whose second face the cloud did not see (>= depth_cover_min_m and >= depth_cover_min_share of the run, voxels on >= min height bins).
  depth_faces: true
  # ... the two uses are switched separately. Both default OFF (measured: continuation added 2 door candidates on v12; thickness raised wall steps 7 -> 10 on v8):
  depth_extend: false
  depth_thickness: false
  depth_face_tolerance_m: 0.03
  depth_extend_max_m: 0.50
  depth_bin_m: 0.05
  depth_min_voxels: 3
  depth_min_height_bins: 3
  depth_cover_min_m: 0.30
  depth_cover_min_share: 0.30
  # A door / passage is an opening in ONE host wall: parallel wall runs other than the host (offset > door_host_collinear_m from its centreline)
  # are cut back to the jambs (remnants shorter than door_min_piece_m vanish), perpendicular runs that begin inside the span and enter it by more
  # than door_span_enter_m are cut back, and a door without any wall run gets a door-host piece between its jambs (thickness of the nearest wall
  # within door_fill_reach_m).  The pieces it builds (evidence door-host) are no wall lines for the 3D refinement.
  door_spans: true
  door_host_collinear_m: 0.03
  door_span_enter_m: 0.20
  door_min_piece_m: 0.17
  door_fill_reach_m: 1.5
  # An opening has both faces of the wall it interrupts.  Above a door with a measured head the scan sees both faces: two planes that each
  # cover lintel_band_min_share of the width, >= lintel_band_min_m apart with a valley between them (<= valley share of the far plane),
  # replace an assumed thickness (exterior default / learned / filled gap) of that wall and lintel; a measured face never moves for it.
  # Within lintel_corner_snap_m the face ends on the crossing wall's jamb.  Pieces beside an opening differing more than opening_flush_m
  # are aligned (joints kept) unless both faces of both pieces are measured.
  lintel_band: true
  lintel_band_tolerance_m: 0.03
  lintel_band_min_m: 0.10
  lintel_band_min_share: 0.60
  lintel_band_valley_share: 0.30
  lintel_band_clearance_m: 0.05
  lintel_band_min_height_m: 0.15
  lintel_band_min_plane_m: 0.08     # each plane rises this far (a flat soffit / casing top is no wall face)
  lintel_corner_snap_m: 0.04
  opening_flush_m: 0.005
  min_thickness_m: 0.06
  max_thickness_m: 0.45
  exterior_thickness_m: 0.30
  # Without a measured outer face (pairs), the exterior thickness comes from window reveals: wall points of both jambs from the
  # inner face to the frame (depth d >= reveal_min_depth_m) give 2 x (d + reveal_frame_m / 2) - frame assumed in the wall middle.
  # Pieces then carry evidence "exterior-reveal"; without reveals the 0.30 default ("exterior") stays.
  # OFF: DEV exterior error 0.041 -> 0.032 m, VAL neutral, but on VAL l_kitchen_212 the changed thickness lost a hidden wall (recall 1.00 -> 0.83).
  exterior_from_reveals: false
  reveal_frame_m: 0.08
  reveal_min_depth_m: 0.04
  # Hidden-wall room edges additionally needing vertical point evidence (off: drops real hidden exterior walls on v12).
  room_edge_vertical_evidence: false
  # A room edge where the data ends (depth <= 5 cm) and whose outside up to a measured wall (within max_thickness_m + 0.5 m) holds no data is an unscanned pocket, no wall.
  # OFF: on bench VAL l_kitchen_212 it removed a real hidden kitchen wall (wall recall 1.00 -> 0.83).
  room_edge_unscanned_pocket: false
  interior_thickness_m: 0.12
  probe_m: 0.80
  side_probe_m: 0.25
  sample_step_m: 0.05
  min_run_m: 1.0
  pair_min_overlap_m: 0.10
  pair_gap_m: 1.0
  pair_angle_deg: 3.0
  collinear_offset_m: 0.04
  # Chained wall fragments across a door/passage share one centreline and thickness up to this offset/gap.  A real offset stays only
  # when both faces are independently measured for step_proof_face_length_m and differ by at least step_proof_offset_m.
  flush_line_offset_m: 0.20
  flush_chain_gap_m: 1.50
  step_proof_face_length_m: 0.30
  step_proof_offset_m: 0.06
  cluster_gap_m: 0.04
  cluster_snap_m: 0.04
  joint_tolerance_m: 0.04
  joint_reach_m: 0.35
  jamb_reach_m: 0.15
  min_face_m: 0.10
  jog_m: 0.04
  min_piece_area_m2: 0.003
  isolated_max_length_m: 1.2
  stub_end_reach_m: 0.10            # ... where "has a wall" means touching within this distance (0 = joint_reach_m)
  stub_min_length_m: 0.6            # faces shorter than this need a wall at BOTH ends (0 = off)
  isolated_free_max_length_m: 2.5   # free-standing face (no wall at either end) shorter than this is dropped (0 = off)
  isolated_free_room_distance_m: 0.6  # ... unless a ceiling room lies this close
  keep_isolated_faces: false
  room_edge_walls: true
  room_edge_min_area_m2: 2.0
  room_edge_min_length_m: 0.30
  room_edge_opening_reach_m: 0.8    # a room edge this close to a parallel door/window span invents no wall (0 = off)
  hatch: true
  bound_rooms: true
  room_gap_m: 0.20
  room_merge_max_area_m2: 2.0
  room_fill_min_share: 0.25
  # Evidence checks: a face in front of furniture whose data never forms a wall (wall points over
  # face_min_height_m reaching face_reach_m, or a floor-connected surface) is dropped; a face no
  # camera of the level can see (mirror phantom behind a wall) is dropped.
  face_test: true
  face_min_height_m: 1.0
  face_reach_m: 1.7
  face_min_share: 0.25
  visibility_test: true
  visibility_max_m: 12.0
  visibility_min_share: 0.15
  # Doors: a door detected as its open leaf becomes the opening in the wall at its hinge; doorways
  # (no sill/mid-height points, floor through the wall) are detected in the wall bodies; a door
  # span that is solid wall is dropped; stubs shorter than min_stub_m beside an opening are not built.
  door_leaf_reorient: true
  door_detect: true
  door_min_width_m: 0.55
  door_max_width_m: 1.40
  door_floor_share: 0.15
  min_stub_m: 0.15
  # Tall built-in units: a wall face at the front of a fridge / oven tower / tall kitchen cabinet (fine labels)
  # with a wall behind at unit depth and no floor or low surfaces in between becomes an A-EINB unit ("KS"/"HS");
  # the wall behind stays or is continued behind the unit.
  tall_units: true
  tall_unit_band_m: 0.12
  tall_unit_min_m: 0.45
  tall_unit_gap_m: 0.30
  tall_unit_reach_m: 1.0
  tall_unit_min_depth_m: 0.40
  tall_unit_max_depth_m: 0.90
  tall_unit_side_gap_m: 0.60
  tall_unit_neighbour_gap_m: 0.40
  tall_unit_room_m: 0.40
  tall_unit_room_free: 0.50
  tall_unit_max_free: 0.15
  tall_unit_max_low: 0.25
  tall_unit_fridge_m: 0.60
  # A wall run on kitchen / cabinet labels (share >= cabinet_min_share) whose wall-class points of wall height cover at most
  # cabinet_max_wall_share of it is a cabinet front taken as a wall; a real wall behind cabinets keeps its wall points and stays.
  cabinet_walls: true
  cabinet_min_share: 0.50
  cabinet_max_wall_share: 0.50
  cabinet_dilate_m: 0.05
  cabinet_flank_m: 0.50
  cabinet_stretch_min_m: 0.60
  cabinet_stretch_gap_m: 0.25
  cabinet_remnant_min_m: 0.45
  cabinet_run_min_share: 0.40
  cabinet_run_max_support: 0.15

# Plan polish (after the double-line walls): rooms = wall cells, regular furniture, wall-hugging kitchen, clean labels.
plan_polish:
  enabled: true
  # Every wall-enclosed cell with floor is one room (open plan = one room); a cell holding several measured
  # ceiling rooms is split only at a passage between two wall corners no wider than room_split_max_m.
  cell_rooms: true
  room_min_area_m2: 1.0
  room_min_floor_share: 0.10
  room_split_max_m: 0.0             # rooms go from door to door: a wall cell is never split by a ceiling-room step (the door lines split, see indoor_door_rooms)
  room_split_min_area_m2: 2.0
  room_jog_m: 0.04
  wall_crack_cell_max_m2: 12.0      # a cell that exists only after that closing counts as a room up to this area (bath / WC, not a whole flat)
  wall_crack_m: 0.02                # hairline gaps (<= 2x = 4 cm) beside a door/window span are closed before small cells are found (0 = off)
  barrier_bridge_m: 0.30            # two door/window spans closer than this get the wall stub between them (0 = off)
  wall_slot_m: 0.06                 # slots up to 2x this (12 cm) between two wall bodies close before wall cells are found: nobody passes 12 cm, it is one wall seen twice (0 = off)
  wall_slot_min_m: 0.30             # ... only slots at least this long (a short notch is a corner)
  room_step_m: 0.30
  # Furniture: rectangle along the wall axes when it covers the footprint (IoU), else a rectilinear outline
  # with steps >= furniture_step_m and at most furniture_max_vertices corners; clipped out of the walls.
  furniture: true
  furniture_rect_iou: 0.75
  furniture_snap_deg: 15.0
  furniture_step_m: 0.15
  furniture_max_vertices: 8
  furniture_min_area_m2: 0.06
  furniture_nested_share: 0.80
  furniture_merge_gap_m: 0.10
  furniture_detail_tolerance_m: 0.03
  # Shape recognition per object: rectangle, L (corner sofa, L desk), U, round, rectilinear, chosen by
  # (1 - IoU) + class-dependent complexity penalty against the traced footprint; sofas get backrest/armrest lines.
  furniture_shapes: true
  furniture_sliver_m: 0.15
  # Object labels: inside the object, else beside it inside the room; none for objects below this area.
  label_min_object_area_m2: 0.15
  label_min_height_m: 0.06
  label_char_width: 0.62
  label_margin_m: 0.04
  # Kitchen run: legs flush on the final inner wall faces, one depth (kitchen_depth_m within the tolerance).
  kitchen: true
  kitchen_wall_reach_m: 0.45
  kitchen_depth_m: 0.60
  kitchen_depth_tol_m: 0.15
  kitchen_end_reach_m: 0.30
  kitchen_segment_reach_m: 0.15
  # Sanitary blocks (WC, washbasin): the side of the block nearest to a final wall face is its back (snapped flush, no gap,
  # no overlap), the front looks into the room.  Farther than sanitary_back_gap_m from every wall = free standing, untouched.
  sanitary_facing: true
  sanitary_back_gap_m: 0.35
  sanitary_tie_m: 0.03              # sides closer than this to equally near walls: keep the current back, else prefer the block's width edges
  sanitary_snap_deg: 12.0           # back edge within this angle of the wall face: block turned square onto the face
  # CAD kitchen (kitchen_layout.py): legs extended along measured counter heights, raised bar on a peninsula,
  # cooktop / sink mounted on the counter at their labels, tall units with a cross, upper cabinets with a cross,
  # counter drawn by its front and end lines.
  kitchen_layout: true

# Rooms go from door to door (door_rooms.py): the interior floor is split only by wall bodies, window spans and
# door lines (through the wall centre, full door width); each side gets half of the door reveal.  Passages do not
# split, furniture never carves a room, floor no wall cell encloses (hall, strips, pockets) joins the room it is open to.
indoor_door_rooms:
  enabled: true
  floor_close_m: 0.50
  floor_grow_m: 0.30
  wall_reach_m: 0.60
  strip_open_m: 0.20
  merge_contact_m: 1.00
  door_overshoot_m: 0.30
  line_buffer_m: 0.04
  contact_m: 0.03
  min_contact_m: 0.15
  min_piece_m2: 0.02
  min_room_m2: 0.50
  furniture_reach_m: 0.40
  support_window_m: 0.50
  support_density: 0.50
  support_step_m: 0.40
  support_grow_m: 0.25
  gap_close_m: 0.30
  gap_close_max_m2: 0.60
  exterior_gap_max_m: 3.2
  pocket_close_m: 0.60
  pocket_min_contact_m: 0.25
  wall_pocket_max_m2: 1.0           # a corner pocket bounded by walls and ONE room is closed over the walls up to this area, so rooms reach the wall faces (0 = off)
  wall_face_reach_m: 0.60           # a pocket between rooms reaches the wall faces within this distance even where the measured support ends (floor hidden behind furniture)
  passage_front_reach_m: 0.15       # a passage joins only the rooms in front of it (this close to probes just beyond both wall faces at its middle half); a span overshooting past a crossing wall does not reach the room behind it
  pocket_open_share: 0.20          # a corner pocket outside every measured room is closed only when at most this share of its outline is open towards unseen space (furniture-hidden corners are enclosed)

# Semantic room names; rooms below min_room_area_m2 without sanitary fixtures are dropped.
indoor_room_names:
  min_room_area_m2: 2.0
  guest_wc_max_area_m2: 4.0
  # An unnamed room with the entrance door plus one more door, or with hall_min_doors doors, is a "Flur"
  # (also a corridor of at least min_hall_area_m2); office_min_items desks/monitors name a room "Büro".
  hall_max_area_m2: 15.0
  hall_min_doors: 3
  small_hall_min_doors: 2           # a cell below min_room_area_m2 that two doors open into (between doors) is a hall: enclosed floor is never lost
  min_hall_area_m2: 0.5
  office_min_items: 2
  kitchen_min_items: 2

# Kitchen run along the walls (straight / L / U) with cooktop and sink inserts from fine labels.
indoor_kitchen_run:
  depth_m: 0.60
  wall_reach_m: 0.30
  strip_reach_m: 0.90
  min_leg_length_m: 0.60
  corner_reach_m: 0.50

# Kitchen fronts measured from the scan points (kitchen_fronts.py): a front across an inner corner at any angle, the base
# standing back under its worktop, the end of an upper cabinet that the scan sees through.  No evidence = square corner.
indoor_kitchen_fronts:
  enabled: true
  band_min_m: 0.12                  # cabinet fronts between plinth ...
  band_max_m: 0.84                  # ... and worktop
  line_tolerance_m: 0.035           # scan noise plus handles and door gaps of one front
  max_shift_m: 0.08                 # a straight front moves at most this far from the fitted run
  corner_min_cut_m: 0.15            # smallest / largest cut of a diagonal unit along a leg
  corner_max_cut_m: 1.10
  corner_min_angle_deg: 15.0        # flatter than this is the straight front itself
  corner_min_coverage: 0.75         # share of the diagonal seen over the front height
  corner_max_residual_m: 0.02       # median distance of its points to the line
  near_front_m: 1.00                # the straight front beside a diagonal unit is judged over about two units when the whole leg is not seen (a peninsula, a tall unit or an open end has no front)
  recess: true
  recess_min_depth_m: 0.12
  recess_min_length_m: 0.40
  upper_trim: true
  upper_trim_min_m: 0.15

# A kitchen leg the label raster lost, established from its scanned front (kitchen_legs.py).  It needs the front from plinth to
# worktop, the worktop at the run's level, kitchen labels, a join to the run and a wall (peninsula: its own back face) behind.
indoor_kitchen_front_legs:
  enabled: true
  min_length_m: 0.60                # straight front
  min_coverage: 0.75                # share of it seen over the front height
  worktop_tolerance_m: 0.07         # same level as the known run
  min_label_share: 0.60             # a table or sideboard along the second wall carries no kitchen labels
  min_depth_m: 0.45                 # wall behind the front
  max_depth_m: 0.80
  refit_free: true                  # a free-standing raster leg (peninsula) takes its body measured in the scan (front, worktop, back face)
  refit_min_overlap: 0.50           # the measured body is the raster leg itself: they share half of the smaller one

# Raised bar top of a peninsula, measured in the scan (samcloud/ortho/vector/kitchen_bar.py): its own solid in the 3D model, the 2D
# band at its measured depth. No bar top without the evidence; the surface-model band of plan_polish stays the fallback without scan points.
indoor_kitchen_bar_top:
  enabled: true
  above_m: 0.08                     # at least this far above the worktop (below: the upstand of the worktop)
  max_level_m: 1.30                 # standing-bar height
  level_tolerance_m: 0.03           # scan noise of a board plus the 1 cm level bins
  edge_share: 0.40                  # the free edge is seen along this share of the leg (a stool or chair back is 0.35-0.45 m wide)
  inside_share: 0.25                # inside the strip the top or what stands on it is seen this often (four scans: 0.29-0.81 inside, 0.04-0.21 beside)
  min_depth_m: 0.15                 # narrower is a rail or an upstand
  max_depth_m: 0.90                 # deeper is a table
  min_carry_m: 0.05                 # it lies this far over the body of the leg
  max_cover_share: 0.80             # of the leg depth; more is the counter itself at that level
  min_length_share: 0.50            # of the leg
  thickness_m: 0.04                 # board whose edge face is not seen

# Outdoor surveyor / DGM site-plan standard (metres).
outdoor_trunk:
  search_radius_m: 1.0
  z_min_m: 0.4
  z_max_m: 1.8
  inlier_tolerance_m: 0.02
  min_points: 30
  min_inliers: 25
  min_inlier_fraction: 0.35
  min_coverage_deg: 120.0
  min_diameter_m: 0.05
  max_diameter_m: 1.5
  ransac_iterations: 400
  text_height_m: 0.5

outdoor_hedges:
  min_height_m: 0.5
  max_height_m: 2.0
  min_area_m2: 2.0
  close_radius_m: 0.3
  smooth_sigma_m: 0.25
  simplify_m: 0.04
  chaikin_iterations: 1

outdoor_spots:
  grid_spacing_m: 17.5
  min_spacing_m: 4.5
  curb_spacing_m: 15.0
  cross_size_m: 0.6
  text_height_m: 0.7
  max_spots: 4000

outdoor_contour_labels:
  text_height_m: 1.0
  interval_m: 60.0
  min_length_m: 20.0
  gap_padding_m: 0.4
  char_width_factor: 0.62

outdoor_roof:
  ridge_percentile: 98.0
  eave_ring_inner_m: 0.3
  eave_ring_outer_m: 1.2
  flat_roof_difference_m: 0.5
  text_height_m: 0.8
  min_area_m2: 20.0

# Door keep-clear zones: kitchen built-ins (niche, upper cabinet, built-in front) never stand on a door span, its casing or its open leaf;
# niches and upper cabinets only exist in the kitchen room.
indoor_door_zone:
  margin_m: 0.10
  leaf_buffer_m: 0.12
  max_overlap_share: 0.25
  # Niches / upper cabinets belong to the kitchen zone widened by this much (the room outline stops at the counter front).
  kitchen_zone_margin_m: 0.80

# Structure beyond plain walls (samcloud/ortho/vector/structure): per-room floor / ceiling (flat, one or two planes), wall
# heights, free-standing columns, beams (soffit drops) and straight stairs from the classified points. Metres / degrees /
# shares; every threshold is a physical default, nothing project-specific. enabled: false keeps storey heights and draws
# no columns / beams / stairs.
structure:
  enabled: true
  max_points: 8000000
  wall_bin_m: 0.2
  wall_min_points_per_bin: 8
  wall_min_bin_share: 0.3
  wall_top_percentile: 98.0
  wall_top_quantile: 75.0
  wall_ceiling_tolerance_m: 0.1
  wall_free_above_ratio: 0.15
  wall_min_height_m: 0.3
  room_erode_m: 0.15
  room_cell_m: 0.25
  room_min_points: 30
  room_min_ceiling_coverage: 0.15
  ceiling_min_clear_m: 1.5
  ceiling_slope_min_deg: 3.0
  ceiling_plane_min_inliers: 0.6
  ceiling_plane_min_rise_m: 0.1
  ceiling_two_plane_gain: 0.15
  ceiling_two_plane_min_share: 0.75
  ceiling_two_plane_min_part: 0.15
  ceiling_two_plane_min_angle_deg: 5.0
  column_cell_m: 0.04
  column_max_section_m: 0.8
  column_min_section_m: 0.08
  column_max_aspect: 2.5
  column_min_height_share: 0.7
  column_top_gap_m: 0.15
  column_wall_clearance_m: 0.1
  column_opening_clearance_m: 0.15
  column_min_points: 60
  column_max_foreign_share: 0.3
  column_max_furniture_overlap: 0.3
  column_max_instance_overlap: 0.6
  column_attached_density: 0.2
  column_max_residual_m: 0.025
  column_max_relative_residual: 0.1
  column_slab_extent_ratio: 1.4
  beam_cell_m: 0.1
  beam_min_drop_m: 0.08
  beam_max_drop_m: 0.8
  beam_min_width_m: 0.08
  beam_max_width_m: 0.8
  beam_min_length_m: 1.0
  beam_min_elongation: 4.0
  beam_min_fill: 0.55
  beam_support_reach_m: 0.35
  beam_wall_adjacent_m: 0.15
  beam_side_clear_share: 0.6
  stair_min_points: 80
  stair_cluster_m: 0.25
  stair_riser_m: [0.12, 0.23]
  stair_tread_m: [0.18, 0.4]
  stair_comfort_m: [0.5, 0.8]
  stair_min_width_m: 0.6
  stair_max_width_m: 3.0
  stair_min_risers: 3
  stair_min_r2: 0.7
  stair_min_level_share: 0.6
