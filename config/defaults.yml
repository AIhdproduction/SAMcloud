application:
  projects_directory: projects
  language: en

project:
  image_storage: external_reference
  keep_intermediate_files: true

coordinate_systems:
  input_crs: EPSG:4326
  working_crs: LOCAL
  export_crs: EPSG:2056

workflow:
  use_gpu: true
  alignment_mode: incremental
  georeferencing_mode: optional
  control_points_enabled: false
  control_points_mode: none
  export_format: LAS

control_points:
  crs: EPSG:2056+5728
  min_points: 3
  min_observations_per_point: 2
  max_reprojection_px: 3.0
  min_triangulation_angle_deg: 2.0
  max_residual_warning_m: 0.10
  detection:
    enabled: true
    target_type: cross
    secondary_target_type: none
    polarity: bright
    min_contrast: 50
    min_score: 0.72
    max_saturation: 70
    ambiguity_ratio: 0.85
  min_projections: 3
  # Agisoft-style marker error (to the estimated marker position); painted crosses on oblique 20 m imagery reach ~1.2-1.4 px
  max_marker_reprojection_px: 1.5
  merge_tolerance_m: 0.5
  search_radius_min_px: 40
  search_radius_max_px: 800
  stage2_radius_px: 25
  observation_outlier_factor: 3.0
  max_gate_iterations: 3
  continue_automatically: true

classification:
  geometry_refinement: true
  class_set: outdoor
  min_votes: 1
  tile_size: 1008
  tile_min_overlap: 0.2
  mode: segearth_ov3
  # Outdoor 2D model: sam3 or flurseg (own EoMT model, config/flurseg.yml). Indoor always uses sam3.
  engine: sam3
  background_threshold: 0.4
  query_threshold: 0.4
  threshold_sweep: []

acquisition:
  panorama:
    frame_interval_seconds: 1.0
    # Cubemap face side in px. 1232 = between 1024 and native 1440 (5760 px video):
    # ~25 % less dense-matching and SAM time than native with similar results.
    # 0 = native (panorama width / 4); larger values are capped at native.
    cubemap_face_size: 1232
    supported_image_extensions:
      - .jpg
      - .jpeg
    supported_video_extensions:
      - .mp4

viewer:
  # Display-only clean-up of the sparse (tie point) cloud; the COLMAP model is not changed.
  sparse_cleaning:
    enabled: true
    min_track_length: 3            # seen in at least 3 images
    max_reprojection_error: 1.5    # pixels
    min_triangulation_angle_deg: 3.0
    max_camera_distance_factor: 2.0  # x 95th percentile of the nearest-camera distance
    min_neighbors: 4
    min_points: 1000               # smaller clouds are shown unfiltered
    min_keep_ratio: 0.2            # never hide more than 80 % (misconfiguration guard)
