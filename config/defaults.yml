application:
  projects_directory: projects
  language: en

project:
  image_storage: external_reference
  keep_intermediate_files: true

coordinate_systems:
  input_crs: EPSG:4326
  working_crs: LOCAL
  export_crs: EPSG:2056

workflow:
  use_gpu: true
  alignment_mode: incremental
  georeferencing_mode: optional
  control_points_enabled: false
  control_points_mode: none
  export_format: LAS

control_points:
  crs: EPSG:2056+5728
  min_points: 3
  min_observations_per_point: 2
  max_reprojection_px: 3.0
  min_triangulation_angle_deg: 2.0
  max_residual_warning_m: 0.10
  detection:
    enabled: true
    target_type: cross
    secondary_target_type: none
    polarity: bright
    min_contrast: 50
    min_score: 0.72
    max_saturation: 70
    ambiguity_ratio: 0.85
  min_projections: 3
  # Agisoft-style marker error (to the estimated marker position); painted crosses on oblique 20 m imagery reach ~1.2-1.4 px
  max_marker_reprojection_px: 1.5
  merge_tolerance_m: 0.5
  search_radius_min_px: 40
  search_radius_max_px: 800
  stage2_radius_px: 25
  observation_outlier_factor: 3.0
  max_gate_iterations: 3
  continue_automatically: true

classification:
  geometry_refinement: true
  class_set: outdoor
  min_votes: 1
  tile_size: 1008
  tile_min_overlap: 0.2
  mode: segearth_ov3
  background_threshold: 0.4
  query_threshold: 0.4
  threshold_sweep: []

acquisition:
  panorama:
    frame_interval_seconds: 1.0
    cubemap_face_size: 1024
    supported_image_extensions:
      - .jpg
      - .jpeg
    supported_video_extensions:
      - .mp4
